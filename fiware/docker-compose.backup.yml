services:

  mongo-db:
    image: mongo:6.0
    container_name: smart-watch-mongo
    restart: unless-stopped
    command: --bind_ip_all
    volumes:
      - mongo-data:/data/db
    networks:
      - fiware

  orion:
    image: quay.io/fiware/orion:latest
    container_name: smart-watch-orion
    restart: unless-stopped
    depends_on:
      - mongo-db
    command: -dbURI mongodb://mongo-db:27017/orion
    ports:
      - "1026:1026"
    networks:
      - fiware

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: smart-watch-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    networks:
      - fiware

volumes:
  mongo-data:
  mosquitto-data:
  mosquitto-log:

networks:
  fiware:
    driver: bridge
